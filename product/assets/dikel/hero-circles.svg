<svg width="1532" height="1532" viewBox="0 0 1532 1532" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <!-- Inner ring gradient: transparent → white, 60% opacity -->
    <linearGradient id="innerGrad" gradientUnits="userSpaceOnUse"
      x1="766" y1="257" x2="766" y2="1275">
      <stop offset="0" stop-color="#B7C9E7" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Outer ring gradient: blue-ish → white, 40% opacity -->
    <linearGradient id="outerGrad" gradientUnits="userSpaceOnUse"
      x1="766" y1="0" x2="766" y2="1532">
      <stop offset="0" stop-color="#B7C9E7" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Outer ring (larger) -->
  <circle cx="766" cy="766" r="764" stroke="url(#outerGrad)" stroke-width="2" fill="none"/>
  <!-- Inner ring (smaller) -->
  <circle cx="766" cy="766" r="508" stroke="url(#innerGrad)" stroke-width="2" fill="none"/>
</svg>
