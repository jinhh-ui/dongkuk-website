<!-- 메인 콘텐츠 -->
<main class="content">

<!-- 등록/수정 폼 -->
<div class="content-header">
    <h1 class="content-title">채용공고 수정</h1>
</div>

<form method="post" action="../../recruit/update/index.html?id=1" enctype="multipart/form-data">
    <div class="detail-body">
        <div class="detail-main">
            <p class="detail-required-note"><span class="text-red">*</span>는 필수 입력 항목입니다.</p>

            <div class="detail-row">
                <div class="detail-label">공고명 <span class="text-red">*</span></div>
                <input type="text" name="title" value="샘플" placeholder="공고명을 입력해주세요." class="detail-input" required>
            </div>
            <div class="detail-row">
                <div class="detail-label">직군 <span class="text-red">*</span></div>
                <input type="text" name="job_group" value="" placeholder="직군을 입력해주세요." class="detail-input" required>
            </div>
            <div class="detail-row">
                <div class="detail-label">채용정보</div>
                <input type="text" name="recruit_info" value="" placeholder="채용정보를 입력해주세요." class="detail-input">
            </div>
            <div class="detail-row">
                <div class="detail-label">채용기간 <span class="text-red">*</span></div>
                <div class="detail-date-range">
                    <input type="date" name="start_date" value="" class="detail-input-date" required>
                    <span class="filter-date-sep">~</span>
                    <input type="date" name="end_date" value="" class="detail-input-date">
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-label">사람인 링크</div>
                <input type="url" name="external_url" value="" placeholder="사람인 공고 URL" class="detail-input">
            </div>
        </div>
    </div>

    <div class="detail-footer">
        <a href="../../recruit/list/index.html" class="btn-back-list">취소</a>
        <button type="submit" class="btn-back-list btn-back-list-primary">수정</button>
    </div>
</form>
</main><!-- /.content -->
</div><!-- /.admin-wrap -->
<script src="../../public/js/admin.js"></script>
