<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용공고 상세 - 동국산업</title>
    <meta name="description" content="동국산업 채용공고 상세">
    <link rel="icon" type="image/svg+xml" href="../assets/common/favicon.svg">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/gnb.css">
    <link rel="stylesheet" href="css/job-posting-detail.css">
</head>

<body data-page="job-posting">

    <!-- GNB (PC) -->
    <header class="gnb">
        <div class="gnb-logo">
            <a href="../index.html"><img src="../assets/common/logo.svg" alt="동국산업 로고"></a>
        </div>
        <nav class="gnb-nav">
            <div class="gnb-nav-item">
                <a href="../company/company-info.html" class="gnb-nav-link">회사정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../product/product-center.html" class="gnb-nav-link">제품정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../invest/invest-center.html" class="gnb-nav-link">투자정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../sustainability/environment.html" class="gnb-nav-link">지속가능경영</a>
            </div>
            <div class="gnb-nav-item">
                <a href="talent.html" class="gnb-nav-link" style="font-weight:700;">인재경영</a>
            </div>
        </nav>
        <div class="gnb-utils">
            <div class="gnb-utils-links">
                <a href="../contact/contact.html">문의</a>
                <a href="#">KR</a>
            </div>
            <span class="gnb-divider"></span>
            <button class="gnb-menu-btn" aria-label="메뉴"><span></span><span></span><span></span></button>
        </div>
    </header>

    <!-- 페이지 헤더 -->
    <section class="jpd-page-header">
        <h1 class="jpd-page-title">채용공고</h1>
    </section>

    <!-- 콘텐츠 컨테이너 -->
    <section class="jpd-container">
        <div class="jpd-inner">

            <!-- 왼쪽: 공고 제목 + 이미지 영역 -->
            <div class="jpd-left">
                <h2 class="jpd-job-title">동국산업㈜ 2026년 상하반기 채용 공고(경인영업그룹)</h2>
                <!-- GP: 1200×1444, GM: 328×972, bg=#F1F3F7, radius=30/16 -->
                <div class="jpd-job-image">
                    <span class="jpd-job-image-placeholder">채용내용</span>
                </div>
            </div>

            <!-- 오른쪽: 채용 정보 카드 + 버튼 -->
            <div class="jpd-right">
                <!-- 정보 카드 -->
                <!-- GP: 400×694, pt/pb/pl/pr=32, radius=30, border=#D3D3D3 -->
                <!-- GM: 328×504, pt/pb/pl/pr=20, radius=16, border=#D3D3D3 -->
                <div class="jpd-info-card">

                    <!-- 채용 정보 행들 -->
                    <!-- GP: gap=30, label gap=10 / GM: gap=20, label gap=4 -->
                    <div class="jpd-info-rows">
                        <div class="jpd-info-row">
                            <span class="jpd-info-label">채용 구분</span>
                            <span class="jpd-info-value">공채</span>
                        </div>
                        <div class="jpd-info-row">
                            <span class="jpd-info-label">신입/경력</span>
                            <span class="jpd-info-value">경력</span>
                        </div>
                        <div class="jpd-info-row">
                            <span class="jpd-info-label">지역</span>
                            <span class="jpd-info-value">경기 시흥</span>
                        </div>
                        <div class="jpd-info-row">
                            <span class="jpd-info-label">마감일</span>
                            <span class="jpd-info-value">2026.04.30 13:00</span>
                        </div>
                    </div>

                    <!-- 버튼 그룹 -->
                    <!-- GP: 336×80, gap=16 / GM: 288×56, gap=10 -->
                    <div class="jpd-btn-group">
                        <a href="#" class="jpd-btn jpd-btn--primary">지원하기</a>
                        <a href="job-posting.html" class="jpd-btn jpd-btn--outline">목록</a>
                    </div>
                </div>

                <!-- 안내 문구 -->
                <!-- GP: fs=20, fw=400 / GM: fs=16 -->
                <p class="jpd-note">본 채용은 사람인을 통해 접수를 받고 있습니다.<br>
                지원하기 버튼 클릭 시, 해당 사이트로 연결됩니다.</p>
            </div>

        </div>
    </section>

    <!-- 고객지원 -->
    <div id="support-placeholder"></div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- 상단 이동 버튼 -->
    <div id="btn-top-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../js/gnb.js"></script>
</body>
</html>
