<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="동국산업 윤리강령 위반신고 제보가 정상적으로 접수되었습니다.">
    <link rel="icon" type="image/svg+xml" href="../assets/common/favicon.svg">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/gnb.css">
    <link rel="stylesheet" href="css/ethics-report-complete.css">
</head>

<body data-page="sustainability">

    <!-- GNB (PC) -->

        <div class="gnb-logo">
            <a href="../index.html"><img src="../assets/common/logo.svg" alt="동국산업 로고"></a>
        </div>
        <nav class="gnb-nav">
            <div class="gnb-nav-item">
                <a href="../company/company-info.html" class="gnb-nav-link">회사정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../product/product-center.html" class="gnb-nav-link">제품정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../invest/invest-center.html" class="gnb-nav-link">투자정보</a>
            </div>
            <div class="gnb-nav-item">
                <a href="environment.html" class="gnb-nav-link">지속가능경영</a>
            </div>
            <div class="gnb-nav-item">
                <a href="../talent/talent.html" class="gnb-nav-link">인재경영</a>
            </div>
        </nav>
        <div class="gnb-utils">
            <div class="gnb-utils-links">
                <a href="../contact/contact.html">문의</a>
                <a href="#">KR</a>
            </div>
            <span class="gnb-divider"></span>
            <button class="gnb-menu-btn" aria-label="메뉴"><span></span><span></span><span></span></button>
        </div>
    </header>

    <!-- 페이지 헤더 -->
    <section class="page-header">
        <h1>제보하기</h1>
    </section>

    <!-- 접수 완료 콘텐츠 (익명) -->
    <section class="erc-section">
        <div class="erc-title-group">
            <img class="erc-icon" src="../assets/common/ic_contact_complete.svg" alt="">
            <p class="erc-title">제보가 정상적으로 접수되었습니다.</p>
        </div>

        <div class="erc-contents-wrap">
            <!-- 접수번호 카드 (익명: 접수번호 + 비밀번호) -->
            <div class="erc-card">
                <div class="erc-card-inner">
                    <div class="erc-card-row">
                        <span class="erc-card-label">접수번호</span>
                        <div class="erc-card-value-group">
                            <span class="erc-card-value" id="receiptNumber">ESG-2026-00123</span>
                            <button type="button" class="erc-copy-btn" data-copy="receiptNumber" aria-label="접수번호 복사">
                                <img src="assets/ethics/copy.svg" alt="" width="36" height="36">
                                <span class="erc-copy-tooltip">복사됨!</span>
                            </button>
                        </div>
                    </div>
                    <div class="erc-card-row">
                        <span class="erc-card-label">비밀번호</span>
                        <div class="erc-card-value-group">
                            <span class="erc-card-value" id="passwordValue">abc123</span>
                            <button type="button" class="erc-copy-btn" data-copy="passwordValue" aria-label="비밀번호 복사">
                                <img src="assets/ethics/copy.svg" alt="" width="36" height="36">
                                <span class="erc-copy-tooltip">복사됨!</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 설명 (익명) -->
            <div class="erc-desc-list">
                <div class="erc-desc-item">
                    <span class="erc-desc-dot"></span>
                    <p class="erc-desc-text">익명 접수 시 <strong>접수번호</strong>와 <strong>비밀번호</strong>를 분실하면 결과를 확인할 수 없으니 반드시 별도로 기록하여 보관해 주세요.</p>
                </div>
                <div class="erc-desc-item">
                    <span class="erc-desc-dot"></span>
                    <p class="erc-desc-text">제보하신 내용은 철저히 보호되며 공명하게 처리하겠습니다.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 버튼 섹션 (익명: 2개 나란히) -->
    <div class="erc-btn-section">
        <a href="../index.html" class="erc-btn-primary">홈으로 이동</a>
        <a href="ethics-report-check.html" class="erc-btn-outline">제보결과 확인하기</a>
    </div>

    <!-- 고객지원 -->
    <div id="support-placeholder"></div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- 상단 이동 버튼 -->
    <div id="btn-top-placeholder"></div>

    <!-- ★ 임시 플로팅 내비 (나중에 삭제) ★ -->
    <div style="position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;">
        <a href="ethics-report-complete.html" style="background:#F27100;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);">실명 결과</a>
        <a href="ethics-report-complete-anon.html" style="background:#363636;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);">익명 결과</a>
        <a href="ethics-report-check.html" style="background:#1B6B93;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);">결과 조회</a>
    </div>

    <script src="../js/components.js"></script>
    <script src="../js/gnb.js"></script>
    <script>
    (function() {
        'use strict';
        var params = new URLSearchParams(window.location.search);
        var receiptNum = params.get('receipt') || 'ESG-2026-00123';
        var pw = params.get('pw') || 'abc123';

        document.getElementById('receiptNumber').textContent = receiptNum;
        document.getElementById('passwordValue').textContent = pw;

        // 복사 기능
        document.querySelectorAll('.erc-copy-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var targetId = this.getAttribute('data-copy');
                var text = document.getElementById(targetId).textContent;
                var tooltip = this.querySelector('.erc-copy-tooltip');

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }

                tooltip.classList.add('is-visible');
                setTimeout(function() {
                    tooltip.classList.remove('is-visible');
                }, 1500);
            });
        });
    })();
    </script>
</body>
</html>
